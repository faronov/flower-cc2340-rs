[package]
name = "flower-cc2340r5"
description = "Pure-Rust board support for koptserg's CC2340R5 RGE soil-moisture (flower) board"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
# Application runtime: `take()` initializes power, clocks, standby and the
# Embassy time driver. Bootloaders disable it and use `take_boot()`.
runtime = ["cc2340r5-hal/runtime"]

[dependencies]
cc2340r5-hal = { workspace = true, default-features = false }
