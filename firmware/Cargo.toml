[package]
name = "cc2340-flower"
description = "Zigbee Sleepy End Device firmware for the CC2340R5 flower soil sensor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["koptserg"]
# Soil-probe calibration of koptserg's board build.
koptserg = ["cc2340-flower-product/koptserg"]
# Soil-probe calibration of the DIYZi board build.
diyzi = ["cc2340-flower-product/diyzi"]

[dependencies]
cc2340-flower-product.workspace = true
flower-cc2340r5.workspace = true
sensor-sed-app.workspace = true
zigbee-types.workspace = true
zigbee-mac = { workspace = true, features = ["cc2340"] }
zigbee-zcl = { workspace = true, features = ["default"] }
zigbee-runtime = { workspace = true, features = ["default"] }

# Pinned nightly gives each task compiler-sized static storage, not a 4 KiB arena.
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "nightly"] }
embassy-time = "0.5"
embassy-futures = "0.1"

# ARM Cortex-M0+ support
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Logging
log = "0.4"
rtt-target = "0.6"

# Panic handler for embedded target
panic-halt = "1.0"
